name: Build pghoard

# Default to read-only access to all APIs.
permissions: read-all

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes its previous run pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # only use one version for the lint step
        python-version: ["3.10"]

    steps:

      - id: checkout-code
        uses: actions/checkout@v4
        with:
          # Do not persist the token during execution of this job.
          persist-credentials: false

      - id: prepare-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - id: dependencies
        run: |
          pip install .
          pip install ".[dev]"

      - id: pylint
        run: make lint

      - id: mypy
        run: make mypy

      - id: validate-style
        run: |
          make fmt
          if [ $(git diff --name-only --diff-filter=ACMR | wc -l ) != 0 ]; then
            echo "Reformatting failed! Please run make fmt on your commits and resubmit!" 1>&2;
            git diff;
            exit 1;
          fi

  test:
    # Runs alongside lint rather than after it: lint takes a minute or two, and a pull request
    # needs both to pass anyway.
    runs-on: ubuntu-22.04
    # A hung test used to keep a run going until GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each Python version runs the whole suite against one PostgreSQL version, and each other
        # PostgreSQL version runs only the tests parametrized by it, on one Python version. This
        # covers every Python version and every PostgreSQL version without running the full
        # Python x PostgreSQL product (3 x 7 suites), whose extra combinations add no coverage:
        # Python-level behaviour doesn't change with the server version, and the server doesn't
        # change with the client's Python version.
        include:
          - { python-version: "3.10", pg-version: "18", pytest-args: "" }
          - { python-version: "3.11", pg-version: "18", pytest-args: "" }
          - { python-version: "3.12", pg-version: "18", pytest-args: "" }
          - { python-version: "3.12", pg-version: "13", pytest-args: '-m "needs_pg and not pg_version_independent"' }
          - { python-version: "3.12", pg-version: "14", pytest-args: '-m "needs_pg and not pg_version_independent"' }
          - { python-version: "3.12", pg-version: "15", pytest-args: '-m "needs_pg and not pg_version_independent"' }
          - { python-version: "3.12", pg-version: "16", pytest-args: '-m "needs_pg and not pg_version_independent"' }
          - { python-version: "3.12", pg-version: "17", pytest-args: '-m "needs_pg and not pg_version_independent"' }
          - { python-version: "3.12", pg-version: "19", pytest-args: '-m "needs_pg and not pg_version_independent"' }
    name: test (py${{ matrix.python-version }}, pg${{ matrix.pg-version }})
    env:
      PG_VERSION: ${{ matrix.pg-version }}

    steps:
      - id: checkout-code
        uses: actions/checkout@v4

      - id: prepare-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - id: dependencies
        run: |
          # Remove preinstalled Postgres because this will conflict with the version we actually want.
          sudo apt-get remove -u postgresql\*
          # The PostgreSQL apt repository's signing key, fetched over HTTPS rather than from a
          # keyserver (apt-key is deprecated, and keyserver lookups are a common flaky step).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc

          # Setup the Postgres repositories
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main 19" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          # Setup build deps, and only the PostgreSQL version this job tests
          sudo apt-get install -y libsnappy-dev postgresql-${{ matrix.pg-version }}
          # Setup common python dependencies
          python -m pip install --upgrade pip
          pip install ".[constraints]"
          pip install -e ".[dev]"

      - id: unittest
        # The same command as `make coverage`, without its second pip install. -n auto: one
        # pytest-xdist worker per CPU; --dist worksteal: an idle worker takes queued tests from a
        # busy one, so a few slow tests don't leave the others waiting. --timeout: fail a hung
        # test instead of the whole job. --durations: list the slowest tests in every job.
        run: >
          python -m pytest -v -n auto --dist worksteal --timeout=900 --durations=25 ${{ matrix.pytest-args }}
          --cov-report term-missing --cov-report xml:coverage.xml --cov pghoard test/

      - id: upload-codecov
        # Third-party action pinned to v3.1.1
        uses: codecov/codecov-action@d9f34f8cd5cb3b3eb79b3e4b5dae3a16df499a70
        with:
          verbose: true
