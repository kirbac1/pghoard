name: Build pghoard

# Default to read-only access to all APIs.
permissions: read-all

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

# A new push to a pull request makes its previous run pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # only use one version for the lint step
        python-version: ["3.10"]

    steps:

      - id: checkout-code
        uses: actions/checkout@v3
        with:
          # Do not persist the token during execution of this job.
          persist-credentials: false

      - id: prepare-python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - id: dependencies
        run: |
          pip install .
          pip install ".[dev]"

      - id: pylint
        run: make lint

      - id: mypy
        run: make mypy

      - id: validate-style
        run: |
          make fmt
          if [ $(git diff --name-only --diff-filter=ACMR | wc -l ) != 0 ]; then
            echo "Reformatting failed! Please run make fmt on your commits and resubmit!" 1>&2;
            git diff;
            exit 1;
          fi

  test:
    # Runs alongside lint rather than after it: a pull request needs both to pass anyway.
    runs-on: ubuntu-22.04
    # A hung test used to keep a run going until GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every Python and PostgreSQL pair gets its own job, so what used to run one version after
        # another in a job now runs side by side, and nothing stops being tested. The tests that don't
        # need a server run once per Python version.
        python-version: ["3.10", "3.11", "3.12"]
        pg-version: ["13", "14", "15", "16", "17", "18", "19"]
        part: ["server"]
        tests: ["needs_pg"]
        include:
          - { python-version: "3.10", pg-version: "18", part: "no server", tests: "not needs_pg" }
          - { python-version: "3.11", pg-version: "18", part: "no server", tests: "not needs_pg" }
          - { python-version: "3.12", pg-version: "18", part: "no server", tests: "not needs_pg" }
    name: test (py${{ matrix.python-version }}, pg${{ matrix.pg-version }}, ${{ matrix.part }})
    env:
      PG_VERSION: ${{ matrix.pg-version }}

    steps:
      - id: checkout-code
        uses: actions/checkout@v3

      - id: prepare-python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - id: dependencies
        run: |
          # Remove preinstalled Postgres because this will conflict with the version we actually want.
          sudo apt-get remove -u postgresql\*
          # Get the postgresql gpg key
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 7FCC7D46ACCC4CF8
          
          # Setup the Postgres repositories
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main 19" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          # Setup build deps, and only the PostgreSQL version this job tests
          sudo apt-get install -y libsnappy-dev postgresql-${{ matrix.pg-version }}
          # Setup common python dependencies
          python -m pip install --upgrade pip
          pip install .
          pip install ".[constraints]"
          pip install -e ".[dev]"

      - id: unittest
        # The same tests as `make coverage`, in two passes: everything except tests marked serial on one
        # pytest-xdist worker per CPU (-n auto), then the serial tests on their own. Keep xdist's default
        # distribution: some basebackup tests only pass in file order on their worker. --timeout fails a
        # hung test instead of the job; --durations lists the slowest tests.
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          python -m pytest -v -n auto --timeout=900 --durations=25 -m "($TESTS) and not serial" --cov pghoard --cov-report= test/
          # Exit code 5 means no test was selected: a part without serial tests.
          python -m pytest -v --timeout=900 --durations=10 -m "($TESTS) and serial" --cov pghoard --cov-append --cov-report= test/ || [ $? -eq 5 ]
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml

      - id: upload-codecov
        # Third-party action pinned to v3.1.1
        uses: codecov/codecov-action@d9f34f8cd5cb3b3eb79b3e4b5dae3a16df499a70
        with:
          verbose: true
